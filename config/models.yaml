# config/models.yaml
#
# Model registry for benchmarking.
#
# Each entry:
#   provider:    openai | anthropic | google
#   model_name:  exact API model string
#   cost_tier:   low | medium | high
#   strengths:   list of tasks this model is well-suited for
#   enabled:     set to false to exclude without deleting the entry

models:

  # ── OpenAI ────────────────────────────────────────────────────────────────
  gpt41_mini:
    provider: openai
    model_name: gpt-4.1-mini
    cost_tier: low
    enabled: true
    strengths:
      - classification
      - extraction
      - qa

  gpt41:
    provider: openai
    model_name: gpt-4.1
    cost_tier: medium
    enabled: true
    strengths:
      - reasoning
      - generation
      - summarization

  gpt4o:
    provider: openai
    model_name: gpt-4o
    cost_tier: medium
    enabled: false
    strengths:
      - classification
      - reasoning
      - generation

  gpt4o_mini:
    provider: openai
    model_name: gpt-4o-mini
    cost_tier: low
    enabled: false
    strengths:
      - classification
      - extraction

  # ── Anthropic ─────────────────────────────────────────────────────────────
  claude_sonnet:
    provider: anthropic
    model_name: claude-sonnet-4-5-20250929
    cost_tier: medium
    enabled: true
    strengths:
      - summarization
      - generation
      - reasoning
      - classification
      - extraction
      - qa

  claude_haiku:
    provider: anthropic
    model_name: claude-haiku-4-5-20251001
    cost_tier: low
    enabled: true
    strengths:
      - classification
      - extraction
      - qa

  claude_opus_45:
    provider: anthropic
    model_name: claude-opus-4-5-20251101
    cost_tier: high
    enabled: false
    strengths:
      - reasoning
      - generation
      - summarization
      - qa
      - classification
      - extraction

  claude_opus_46:
    provider: anthropic
    model_name: claude-opus-4-6
    cost_tier: high
    enabled: false
    strengths:
      - reasoning
      - generation
      - summarization
      - qa
      - classification
      - extraction

  # ── Ollama (local) ───────────────────────────────────────────────────────
  mistral_7b:
    provider: ollama
    model_name: mistral:latest
    cost_tier: low
    enabled: true
    strengths:
      - classification
      - extraction
      - qa
      - reasoning
      - summarization
      - generation

  # ── Google ────────────────────────────────────────────────────────────────
  gemini_flash:
    provider: google
    model_name: gemini-2.5-flash
    cost_tier: low
    enabled: true
    strengths:
      - classification
      - extraction
      - qa

  gemini_pro:
    provider: google
    model_name: gemini-2.5-pro
    cost_tier: medium
    enabled: true
    strengths:
      - qa
      - summarization
      - reasoning
      - generation