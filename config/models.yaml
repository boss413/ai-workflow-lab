# config/models.yaml
#
# Model registry for benchmarking.
#
# Each entry:
#   provider:    openai | anthropic | google
#   model_name:  exact API model string
#   cost_tier:   low | medium | high
#   strengths:   list of tasks this model is well-suited for
#   enabled:     set to false to exclude without deleting the entry

models:

  # ── OpenAI ────────────────────────────────────────────────────────────────
  gpt41_mini:
    provider: openai
    model_name: gpt-4.1-mini
    cost_tier: low
    enabled: true
    strengths:
      - classification
      - extraction
      - qa

  gpt41:
    provider: openai
    model_name: gpt-4.1
    cost_tier: medium
    enabled: true
    strengths:
      - reasoning
      - generation
      - summarization

  gpt4o:
    provider: openai
    model_name: gpt-4o
    cost_tier: medium
    enabled: false
    strengths:
      - classification
      - reasoning
      - generation

  gpt4o_mini:
    provider: openai
    model_name: gpt-4o-mini
    cost_tier: low
    enabled: false
    strengths:
      - classification
      - extraction

  # ── Anthropic ─────────────────────────────────────────────────────────────
  claude_opus:
    provider: anthropic
    model_name: claude-4-6-opus-20250801
    cost_tier: high
    enabled: true
    strengths:
      - coding
      - building agents

  claude_sonnet:
    provider: anthropic
    model_name: claude-sonnet-4-5
    cost_tier: medium
    enabled: true
    strengths:
      - summarization
      - generation
      - reasoning

  claude_haiku:
    provider: anthropic
    model_name: claude-haiku-4-5-20251001
    cost_tier: low
    enabled: true
    strengths:
      - classification
      - extraction
      - qa

  # ── Google ────────────────────────────────────────────────────────────────
  gemini_flash:
    provider: google
    model_name: gemini-2.5-flash
    cost_tier: low
    enabled: true
    strengths:
      - classification
      - extraction
      - qa

  gemini_pro:
    provider: google
    model_name: gemini-2.5-pro
    cost_tier: medium
    enabled: true
    strengths:
      - qa
      - summarization
      - reasoning